spring.application.name=UNIVERSITY-SERVICE
spring.config.import=optional:file:.env[.properties]
server.port=8084

# Banco proprio. createDatabaseIfNotExist: o init.sql do Docker so roda quando o volume e criado
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/university_service?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
# false: as consultas levam CPF como parametro
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}
