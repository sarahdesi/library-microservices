spring.application.name=USER-SERVICE
spring.config.import=optional:file:.env[.properties]
server.port=8081

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/user_service}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}


eureka.server.enable-self-preservation=false
# Autenticacao (valores reais so em variaveis de ambiente / .env, nunca no git)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=PT1H
app.librarian.email=${LIBRARIAN_EMAIL:}
app.librarian.password=${LIBRARIAN_PASSWORD:}
