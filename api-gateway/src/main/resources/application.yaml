server:
  port: 8080

spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/users/**,/auth/**

            - id: catalog-service
              uri: lb://CATALOG-SERVICE
              predicates:
                - Path=/books/**

            - id: loan-service
              uri: lb://LOAN-SERVICE
              predicates:
                - Path=/loans/**,/fines/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
# Autenticacao: a mesma chave do user-service (minimo 32 caracteres), so por variavel de ambiente
app:
  jwt:
    secret: ${JWT_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
